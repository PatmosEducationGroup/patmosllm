name: Weekly DB Schema Backup

# Dumps the database SCHEMA ONLY (no rows / no PII) once a week and commits it
# to db/schema.sql. The commit diff is your structural-drift log. Full DATA
# backups are NOT done here — they run locally (scripts/backup-db-local.sh) and
# never touch git, to preserve GDPR posture.

on:
  schedule:
    - cron: "0 6 * * 0"      # every Sunday 06:00 UTC
  workflow_dispatch: {}        # allow manual runs from the Actions tab

permissions:
  contents: write              # needed to commit the refreshed schema

concurrency:
  group: db-backup-schema
  cancel-in-progress: false

jobs:
  schema-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Install a pg_dump whose major version is >= the Supabase server.
      # Bump POSTGRES_MAJOR to match your project's Postgres major version.
      - name: Install PostgreSQL client (PGDG)
        env:
          POSTGRES_MAJOR: "17"
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-${POSTGRES_MAJOR}"
          # The runner ships an older pg_dump (v16) that wins on PATH; pin the
          # freshly-installed v17 bindir so `pg_dump` matches the PG17 server.
          # (pg_dump < server major aborts with a version-mismatch error.)
          echo "/usr/lib/postgresql/${POSTGRES_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Dump schema
        env:
          # Use the SESSION-pooler connection string (IPv4-friendly; GitHub
          # runners are IPv4-only and Supabase direct hosts are often IPv6).
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump --version   # must report 17.x (not the runner's default 16.x)
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL repo secret is not set."; exit 1
          fi
          chmod +x scripts/backup-db-schema.sh
          ./scripts/backup-db-schema.sh db/schema.sql

      - name: Commit if schema changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage first: `git diff` alone ignores untracked files, so the very
          # first run (schema.sql brand new) would otherwise report "no change"
          # and never commit. Compare the staged tree against HEAD instead.
          git add db/schema.sql
          if git diff --cached --quiet; then
            echo "No schema changes this week."
          else
            git commit -m "chore(db): weekly schema snapshot"
            git push
          fi
